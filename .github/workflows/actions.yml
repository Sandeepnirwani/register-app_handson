name: CI-CD-Pipeline

on:
  workflow_dispatch:

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Run Unit Tests
        run: mvn test
 
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=Sandeepnirwani_register-app_handson \
          -Dsonar.organization=sandeepnirwani \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}


      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/register-app:${{ github.run_number }} .

      - name: Scan Docker Image using Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/register-app:${{ github.run_number }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/register-app:${{ github.run_number }}


    # Clone GitOps Manifest Repo
      - name: Clone Manifest Repository
        run: |
          git clone https://${{ secrets.GH_TOKEN }}@github.com/Sandeepnirwani/register-app-manifests.git


      # Update Kubernetes Deployment YAML
      - name: Update Kubernetes Manifest
        run: |
          cd register-app-manifests

          sed -i "s#image:.*#image: ${{ secrets.DOCKER_USERNAME }}/register-app:${{ github.run_number }}#g" deployment.yml

          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git add .
          git commit -m "Updated image to version ${{ github.run_number }}"

          git push
          git push
